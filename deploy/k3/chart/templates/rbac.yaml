apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-plane
  namespace: open-swe-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-cleanup
  namespace: open-swe-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-manager
  namespace: open-swe-sandboxes
rules:
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-manager
  namespace: open-swe-sandboxes
subjects:
  - kind: ServiceAccount
    name: control-plane
    namespace: open-swe-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-cleaner
  namespace: open-swe-sandboxes
rules:
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-cleaner
  namespace: open-swe-sandboxes
subjects:
  - kind: ServiceAccount
    name: sandbox-cleanup
    namespace: open-swe-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-cleaner
