# Server for the open-swe dashboard SPA.
#
# tailscale / the Cloudflare tunnel terminate TLS and forward plain HTTP here.
# The app is a TanStack Start SPA in shell mode: the prerendered entry is
# `_shell.html` (the file Vercel rewrites all routes to), so every client-routed
# path falls back to it.
#
# Same-origin API: `/dashboard/api/*` is reverse-proxied to the backend
# (FastAPI dashboard API + GitHub OAuth), so the dashboard and its API share one
# origin. This is the setup upstream's vercel.json uses (its rewrite proxies the
# same prefix). It keeps the session cookie first-party and makes the OAuth
# redirect_uri same-origin — the browser only ever talks to this host.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index _shell.html;

    # Reverse-proxy the dashboard API + OAuth to the backend Service (same
    # namespace). No path rewrite: the backend also serves under /dashboard/api.
    location /dashboard/api/ {
        proxy_pass http://open-swe:2024;
        # Agents chat submits pasted/screenshotted images as base64 inside the
        # run body; nginx's 1m default would 413 them before the backend. 25m
        # covers large screenshots (base64 is ~4/3 the raw size).
        client_max_body_size 25m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Public entry is always HTTPS (Cloudflare / tailscale terminate TLS);
        # the backend uses this for Secure-cookie + redirect_uri decisions.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        # Agents-chat responses stream (SSE): disable buffering + allow long reads.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # The app shell must never be cached, so new deploys are picked up immediately.
    location = /_shell.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /_shell.html;
    }
}
