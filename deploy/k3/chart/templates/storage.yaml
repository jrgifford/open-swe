apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: graph-state
  namespace: open-swe-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.config.graphStorage }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: proxy-ca
  namespace: open-swe-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.config.proxyStorage }}
