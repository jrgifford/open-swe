# Static server for the open-swe dashboard SPA.
#
# tailscale terminates TLS and forwards plain HTTP here. The app is a TanStack
# Start SPA in shell mode: the prerendered entry is `_shell.html` (the same file
# Vercel rewrites all routes to), so every client-routed path must fall back to
# it. API calls go cross-origin to VITE_DASHBOARD_API_BASE_URL (baked at build
# time), so nothing is proxied here.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index _shell.html;

    # The app shell must never be cached, so new deploys are picked up
    # immediately.
    location = /_shell.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /_shell.html;
    }
}
